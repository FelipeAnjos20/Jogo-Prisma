name: CD

on:
  push:
    tags:
      - "v*.*.*"

# Necessario para o GITHUB_TOKEN criar a release (sem isso a publicacao falhava
# com "Resource not accessible by integration").
permissions:
  contents: write

env:
  GODOT_VERSION: "4.6.3"
  RCEDIT_VERSION: "v2.0.0"

jobs:
  build:
    name: Build Windows (exportado no Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Instalar Godot headless
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Importar recursos do projeto
        run: godot --headless --editor --quit-after 60

      - name: Exportar build Windows Desktop
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/Prisma.exe

      - name: Guardar a build para a proxima etapa
        uses: actions/upload-artifact@v4
        with:
          name: prisma-windows
          path: build/windows/
          if-no-files-found: error

  release:
    name: Icone, versao e publicacao da release
    needs: build
    # No Linux o Godot nao grava icone e versao no .exe; no Windows o rcedit grava.
    # Um .exe com essas informacoes costuma gerar menos alarmes falsos de antivirus.
    runs-on: windows-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Baixar a build
        uses: actions/download-artifact@v4
        with:
          name: prisma-windows
          path: build/windows

      - name: Gravar icone e versao no Prisma.exe
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v") + ".0"
          $rcedit = "$env:RUNNER_TEMP\rcedit-x64.exe"
          Invoke-WebRequest -UseBasicParsing "https://github.com/electron/rcedit/releases/download/$env:RCEDIT_VERSION/rcedit-x64.exe" -OutFile $rcedit
          & $rcedit "build/windows/Prisma.exe" `
            --set-icon "icon.ico" `
            --set-file-version $version `
            --set-product-version $version `
            --set-version-string "ProductName" "PRISMA" `
            --set-version-string "FileDescription" "PRISMA - O lugar onde a luz quebrou" `
            --set-version-string "CompanyName" "Equipe PRISMA - Catolica SC" `
            --set-version-string "LegalCopyright" "Equipe PRISMA - PAC Extensionista III" `
            --set-version-string "OriginalFilename" "Prisma.exe"
          if ($LASTEXITCODE -ne 0) { throw "rcedit falhou ($LASTEXITCODE)" }
          (Get-Item "build/windows/Prisma.exe").VersionInfo | Format-List FileVersion, ProductVersion, ProductName, FileDescription

      - name: Compactar build
        shell: pwsh
        run: Compress-Archive -Path "build/windows/*" -DestinationPath "Prisma-windows-${{ github.ref_name }}.zip"

      - name: Publicar release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: "PRISMA ${{ github.ref_name }}"
          body: "Build automatica gerada a partir da tag ${{ github.ref_name }}."
          files: "Prisma-windows-${{ github.ref_name }}.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
