name: Web

# Publica a versao para jogar no navegador no GitHub Pages a cada push na main.
# Assim ninguem precisa baixar o .exe (que o antivirus pode bloquear por engano).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicacao por vez; a mais nova substitui a anterior.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.6.3"

jobs:
  build:
    name: Exportar versao Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Instalar Godot headless
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Importar recursos do projeto
        run: godot --headless --editor --quit-after 60

      - name: Exportar build Web
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          ls -la build/web

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar a build para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
